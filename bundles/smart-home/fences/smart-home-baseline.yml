version: "smart-home-baseline/v1"
default_level: "review"
rules: [{"rule_id": "R-SH1", "name": "内部计划与记录可逆自动", "level": "auto", "is_baseline": true, "match": {"object_types": ["content", "lead", "task", "goal", "workflow", "report", "store"], "actions": ["content.create", "lead.create", "task.submit", "goal.create", "workflow.start", "workflow.tick", "store.upsert"]}, "when": "params.public != true", "note": "内部经营草稿与记录自动；越界动作仍由更严格规则覆盖。"}, {"rule_id": "R-SH2", "name": "未授权数据和用途阻断", "level": "block", "is_baseline": true, "match": {"object_types": ["lead", "customer", "survey", "content", "aftercare"], "actions": ["lead.contact", "data.export", "content.publish", "customer.contact"]}, "when": "params.consent_missing == true || params.consent_denied == true", "note": "未知或拒绝用途授权不得外发、触达或扩大使用。"}, {"rule_id": "R-SH3", "name": "任何对外发布必审", "level": "review", "is_baseline": true, "match": {"object_types": ["content", "campaign", "channel"], "actions": ["content.publish", "content.request_publication", "campaign.launch", "live.publish"]}, "when": "true", "note": "公开笔记、视频、官网、投放、直播每次均绑定准确内容的人类审批。"}, {"rule_id": "R-SH4", "name": "外发触达和预算变更必审", "level": "review", "is_baseline": true, "match": {"object_types": ["lead", "customer", "campaign", "partner"], "actions": ["customer.contact", "campaign.budget", "partner.commit"]}, "when": "true", "note": "咨询答复与营销用途分离；批量触达和预算变更必须人类批准。"}, {"rule_id": "R-SH5", "name": "秘密与家庭隐私外发阻断", "level": "block", "is_baseline": true, "match": {"object_types": ["content", "customer", "survey", "device"], "actions": ["content.publish", "data.export", "customer.contact"]}, "when": "params.contains_secret == true || params.contains_private_home_data == true", "note": "密码、令牌、配对码、原始家庭影像及未经许可图纸禁止外发。"}, {"rule_id": "R-SH6", "name": "未知兼容或过期依据阻断", "level": "block", "is_baseline": true, "match": {"object_types": ["solution", "compatibility", "device", "sku"], "actions": ["solution.build", "compatibility.commit", "device.configure"]}, "when": "params.compatibility_unknown == true || params.evidence_expired == true", "note": "兼容要求型号、固件、生态、功能与有效来源；协议相同不能替代证据。"}, {"rule_id": "R-SH7", "name": "价格资金合同承诺必审", "level": "review", "is_baseline": true, "match": {"object_types": ["quote", "contract", "project", "receivable"], "actions": ["quote.request_approval", "quote.commit", "contract.sign", "project.create", "payment.execute", "refund.execute"]}, "when": "true", "note": "对客报价、合同、支付、退款与资金承诺始终人审；真实动作与本地记录区分。"}, {"rule_id": "R-SH8", "name": "缺现场证据禁止工程推进", "level": "block", "is_baseline": true, "match": {"object_types": ["survey", "project", "commissioning", "acceptance"], "actions": ["survey.confirm", "project.milestone", "commissioning.record", "acceptance.record"]}, "when": "params.evidence_missing == true || params.synthetic_in_live == true", "note": "沙箱合成数据不得计生产勘测、安装、调试与验收。"}, {"rule_id": "R-SH9", "name": "危险设备控制与无资质施工阻断", "level": "block", "is_baseline": true, "match": {"object_types": ["device", "project", "alert"], "actions": ["door.unlock", "electrical.control", "fire.control", "device.reset", "installation.execute"]}, "when": "params.professional_missing == true || params.safety_event == true || params.customer_authorization_missing == true", "note": "门锁、强电、消防、危险重置不可模型自动控制；转合格人员与客户授权。"}, {"rule_id": "R-SH10", "name": "毛利折扣超界与支付阻断", "level": "block", "is_baseline": true, "match": {"object_types": ["quote", "procurement", "receivable"], "actions": ["quote.commit", "approval.decide", "procurement.order", "payment.execute"]}, "when": "params.margin_below_floor == true || params.discount_exceeded == true || params.payment_connector_missing == true", "note": "最低毛利与最大折扣取门店配置；允许形成未达标草稿供诊断，但人类也不能批准或承诺越过硬底线。"}, {"rule_id": "R-SH11", "name": "工程里程碑与替代型号人审", "level": "review", "is_baseline": true, "match": {"object_types": ["project", "procurement", "commissioning"], "actions": ["procurement.record", "project.milestone", "commissioning.record", "project.change"]}, "when": "true", "note": "现场责任人提交真实记录；替代型号与范围变更先复核。"}, {"rule_id": "R-SH12", "name": "缺客户验收和交接阻断", "level": "block", "is_baseline": true, "match": {"object_types": ["acceptance", "project", "aftercare"], "actions": ["acceptance.record", "aftercare.resolve"]}, "when": "params.customer_confirmed != true || params.training_missing == true || params.credentials_transfer_missing == true || params.outstanding_issues == true", "note": "客户签收、培训、控制权移交和未闭问题有明确门；内部完工不等于交付。"}, {"rule_id": "R-SH13", "name": "售后安全隐私升级必审", "level": "review", "is_baseline": true, "match": {"object_types": ["aftercare", "alert"], "actions": ["aftercare.resolve", "device.reset", "data.erase"]}, "when": "params.safety_event == true || params.privacy_event == true || params.destructive == true", "note": "安全隐私及破坏性恢复先转专业人员与客户确认。"}, {"rule_id": "R-SH14", "name": "授权阈值与经营宪章变更必审", "level": "review", "is_baseline": true, "match": {"object_types": ["goal", "store", "fence", "workflow"], "actions": ["goal.instruct", "store.autonomy_change", "fence.update", "workflow.authority_change"]}, "when": "true", "note": "目标调整、权限扩大与阈值变化需要董事长；更严格不可变红线仍优先。"}, {"rule_id": "R-SH15", "name": "外部连接器未启用阻断", "level": "block", "is_baseline": true, "match": {"object_types": ["content", "campaign", "device", "payment"], "actions": ["content.publish", "campaign.launch", "device.control", "payment.execute"]}, "when": "params.connector_ready != true", "note": "当前版本的本地可用性不得冒充真实平台发布、投放、设备控制或支付。"}, {"rule_id": "R-SH16", "name": "夜间危险外部动作阻断", "level": "block", "is_baseline": true, "match": {"object_types": ["project", "device", "quote", "campaign"], "actions": ["installation.execute", "door.unlock", "payment.execute", "campaign.launch"]}, "when": "context.night_shift == true", "note": "夜间仅整理草稿、诊断与决策包；危险外部动作保留现场授权。"}]
