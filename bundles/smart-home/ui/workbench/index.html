<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#193b35">
  <title>经营管理系统 · 全屋智能门店</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23254f43'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='24' fill='%23e1eadb'%3EW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到工作区</a>
  <aside class="sidebar">
    <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true">织</span><span>经营管理系统<small>BusinessManagementSystem</small></span></a>
    <div class="workspace"><span class="workspace-icon" aria-hidden="true">⌂</span><div><strong id="store-name">全屋智能门店</strong><small id="store-city">本地经营工作区</small></div><span class="live-dot" aria-label="本地服务"></span></div>
    <p class="nav-label">门店工作台</p>
    <nav aria-label="主导航">
      <a href="#overview" data-page="overview"><span aria-hidden="true">◫</span>经营总览</a>
      <a href="#growth" data-page="growth"><span aria-hidden="true">↗</span>获客与体验</a>
      <a href="#delivery" data-page="delivery"><span aria-hidden="true">⌑</span>方案与交付</a>
      <a href="#aftercare" data-page="aftercare"><span aria-hidden="true">♡</span>售后与回访</a>
      <a href="#approvals" data-page="approvals"><span aria-hidden="true">✓</span>待我确认<span id="approval-count" class="nav-count">0</span></a>
      <a href="#team" data-page="team"><span aria-hidden="true">♧</span>数字员工</a>
      <a href="#records" data-page="records"><span aria-hidden="true">▤</span>业务记录</a>
    </nav>
    <div class="sidebar-note"><span class="note-symbol">✦</span><strong>让团队围绕结果协作</strong><p>设定目标，AI 推进方案与内容。承诺与现场交付，由你把关。</p><button id="new-goal" class="button pale">设定经营目标 <span>＋</span></button></div>
    <button id="owner-session" class="profile"><span class="avatar">店</span><span><strong>店主工作区</strong><small id="owner-label">申请人员确认权限</small></span><span>↗</span></button>
  </aside>
  <div class="shell">
    <header class="topbar"><div><span class="breadcrumb">全屋智能 /</span> <strong id="breadcrumb">经营总览</strong></div><div class="top-actions"><span id="mode" class="tag">正在连接</span><button id="refresh" class="icon-button" aria-label="刷新数据">↻</button></div></header>
    <main id="main" tabindex="-1">
      <div id="banner" role="status" hidden></div>
      <div id="content" aria-live="polite"><div class="loading-block">正在读取门店经营记录…</div></div>
    </main>
    <footer><span>BusinessManagementSystem · 全屋智能门店经营</span><span id="updated">本地数据，外部渠道未连接</span></footer>
  </div>
  <dialog id="drawer" aria-labelledby="drawer-title"><form id="action-form"><div class="drawer-head"><div><small>门店业务</small><h2 id="drawer-title"></h2></div><button type="button" id="close-drawer" class="icon-button" aria-label="关闭">×</button></div><p id="drawer-description"></p><div id="form-fields"></div><div id="form-error" class="form-error" role="alert" hidden></div><div class="drawer-footer"><button type="button" id="cancel-drawer" class="button secondary">取消</button><button type="submit" id="submit-action" class="button primary">保存记录</button></div></form></dialog>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><div class="drawer-head"><h2 id="detail-title">业务详情</h2><button id="close-detail" class="icon-button" aria-label="关闭详情">×</button></div><div id="detail-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
